<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TEENETWORK - Outreach & Session Activity Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf4',
              100: '#dcfce7',
              200: '#bbf7d0',
              300: '#86efac',
              400: '#4ade80',
              500: '#22c55e',
              600: '#16a34a',
              700: '#15803d',
              800: '#166534',
              900: '#14532d',
              950: '#052e16',
            }
          }
        }
      }
    }
  </script>
  <style>
    @media print {
      header, .no-print, .tabs-container { display: none !important; }
      body { background: white !important; color: black !important; }
      .rep-card { break-inside: avoid; border: 1px solid #ccc !important; box-shadow: none !important; margin-bottom: 1rem !important; }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 min-h-screen flex flex-col font-sans transition-colors duration-200">

  <!-- Main Navigation Header -->
  <header class="bg-white/95 dark:bg-slate-800/95 backdrop-blur border-b border-slate-200 dark:border-slate-700 sticky top-0 z-30">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-brand-600 flex items-center justify-center text-white font-bold text-xl shadow-md shadow-brand-500/20">
          TN
        </div>
        <div>
          <h1 class="font-bold text-lg leading-tight tracking-tight text-slate-900 dark:text-white flex items-center gap-2">
            TEENETWORK
            <span id="roleBadge" class="hidden text-xs font-semibold px-2 py-0.5 rounded-full bg-brand-100 dark:bg-brand-900/60 text-brand-800 dark:text-brand-300"></span>
          </h1>
          <p class="text-xs text-slate-500 dark:text-slate-400">Outreach & Activity Reporting Hub</p>
        </div>
      </div>

      <div class="flex items-center space-x-3">
        <!-- Dark Mode Toggle -->
        <button id="themeToggle" onclick="toggleTheme()" title="Toggle theme" class="p-2 rounded-lg text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700 transition">
          <svg id="moonIcon" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
          </svg>
          <svg id="sunIcon" class="w-5 h-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 9H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
          </svg>
        </button>

        <!-- Logged In User Info & Logout -->
        <div id="userMenu" class="hidden items-center space-x-3">
          <span id="userName" class="text-sm font-medium text-slate-700 dark:text-slate-300 hidden sm:inline"></span>
          <button onclick="api('POST','/api/logout').then(boot)" class="px-3 py-1.5 text-xs font-semibold text-rose-600 dark:text-rose-400 hover:bg-rose-50 dark:hover:bg-rose-950/40 rounded-lg border border-rose-200 dark:border-rose-900 transition">
            Log out
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Notification Toast Banner -->
  <div id="toast" class="max-w-6xl mx-auto px-4 mt-3 w-full transition-all duration-300"></div>

  <!-- Primary Application Container -->
  <main class="max-w-6xl mx-auto px-4 py-6 w-full flex-1">
    <div id="app" class="flex items-center justify-center py-20 text-slate-500">
      <div class="flex items-center space-x-2">
        <svg class="animate-spin h-5 w-5 text-brand-600" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span>Loading TEENETWORK...</span>
      </div>
    </div>
  </main>

  <!-- Image Lightbox Modal -->
  <div id="lightbox" class="fixed inset-0 z-50 bg-black/90 hidden items-center justify-center p-4 backdrop-blur-sm" onclick="closeLightbox(event)">
    <div class="relative max-w-4xl max-h-[90vh] flex flex-col items-center">
      <button onclick="closeLightbox()" class="absolute -top-12 right-0 text-white hover:text-slate-300 text-3xl font-bold p-2 focus:outline-none">
        &times;
      </button>
      <img id="lightboxImg" src="" alt="Enlarged report photo" class="max-w-full max-h-[85vh] object-contain rounded-lg shadow-2xl">
      <p id="lightboxCaption" class="text-slate-300 text-sm mt-3 text-center"></p>
    </div>
  </div>

  <footer class="border-t border-slate-200 dark:border-slate-800 py-6 text-center text-xs text-slate-500 dark:text-slate-500 no-print">
    TEENETWORK &copy; 2026. Empowering communities through outreach tracking & accountability.
  </footer>

  <script>
    /* State */
    let me = null, centers = [], profiles = [], reports = [], stats = {};
    let activeTab = "reports";
    let mode = "login";
    let filterCenter = "";
    let filterMember = "";
    let filterDate = "all";
    let filterQuery = "";
    let currentEditId = null;
    let reportPhotos = []; // Base64 data URLs for new/edited report
    let resetToken = new URLSearchParams(location.search).get("reset");
    if (resetToken) mode = "reset";

    const $ = id => document.getElementById(id);
    const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const cName = id => (centers.find(c => c.id === Number(id)) || {}).name || "General / Unassigned";

    /* API Helper */
    async function api(m, u, b) {
      const opts = { method: m, headers: { "Content-Type": "application/json" } };
      if (b) opts.body = JSON.stringify(b);
      const r = await fetch(u, opts);
      let d = {};
      try { d = await r.json(); } catch {}
      if (!r.ok) throw new Error(d.error || `Server responded with ${r.status}`);
      return d;
    }

    /* Toast Flash */
    function flash(successMsg, errorMsg) {
      const el = $("toast");
      if (successMsg) {
        el.innerHTML = `
          <div class="flex items-center justify-between p-3.5 rounded-xl bg-emerald-50 dark:bg-emerald-950/60 border border-emerald-200 dark:border-emerald-800 text-emerald-800 dark:text-emerald-200 text-sm shadow-sm animate-fade-in">
            <div class="flex items-center space-x-2">
              <svg class="w-5 h-5 text-emerald-600 dark:text-emerald-400 shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg>
              <span>${esc(successMsg)}</span>
            </div>
            <button onclick="$('toast').innerHTML=''" class="text-emerald-600 hover:text-emerald-800 font-bold ml-4">&times;</button>
          </div>`;
      } else if (errorMsg) {
        el.innerHTML = `
          <div class="flex items-center justify-between p-3.5 rounded-xl bg-rose-50 dark:bg-rose-950/60 border border-rose-200 dark:border-rose-800 text-rose-800 dark:text-rose-200 text-sm shadow-sm animate-fade-in">
            <div class="flex items-center space-x-2">
              <svg class="w-5 h-5 text-rose-600 dark:text-rose-400 shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>
              <span>${esc(errorMsg)}</span>
            </div>
            <button onclick="$('toast').innerHTML=''" class="text-rose-600 hover:text-rose-800 font-bold ml-4">&times;</button>
          </div>`;
      } else {
        el.innerHTML = "";
      }
      if (successMsg || errorMsg) {
        setTimeout(() => { if (el.innerHTML) el.innerHTML = ""; }, 5000);
      }
    }

    /* Theme Toggle */
    function initTheme() {
      if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
        $("moonIcon").classList.add("hidden");
        $("sunIcon").classList.remove("hidden");
      } else {
        document.documentElement.classList.remove('dark');
        $("moonIcon").classList.remove("hidden");
        $("sunIcon").classList.add("hidden");
      }
    }
    function toggleTheme() {
      if (document.documentElement.classList.contains('dark')) {
        document.documentElement.classList.remove('dark');
        localStorage.theme = 'light';
        $("moonIcon").classList.remove("hidden");
        $("sunIcon").classList.add("hidden");
      } else {
        document.documentElement.classList.add('dark');
        localStorage.theme = 'dark';
        $("moonIcon").classList.add("hidden");
        $("sunIcon").classList.remove("hidden");
      }
    }

    /* Boot & Data Fetching */
    async function boot() {
      initTheme();
      try {
        me = await api("GET", "/api/me");
      } catch {
        me = null;
      }

      const menu = $("userMenu");
      const badge = $("roleBadge");
      if (me) {
        menu.classList.remove("hidden");
        menu.classList.add("flex");
        $("userName").textContent = me.name;
        badge.classList.remove("hidden");
        badge.textContent = me.is_admin ? "Administrator" : (cName(me.center_id));
        try {
          const d = await api("GET", "/api/data");
          centers = d.centers || [];
          reports = d.reports || [];
          profiles = d.users || [];
          stats = d.stats || {};
        } catch (e) {
          flash("", "Failed to load dashboard data: " + e.message);
        }
      } else {
        menu.classList.add("hidden");
        menu.classList.remove("flex");
        badge.classList.add("hidden");
      }

      render();
    }

    /* Main Render Router */
    function render() {
      const a = $("app");
      if (resetToken && mode === "reset") {
        a.innerHTML = resetView();
        return;
      }
      if (!me) {
        a.innerHTML = authView();
        return;
      }
      if (me.is_admin) {
        a.innerHTML = adminDashboardView() + accountSettingsCard();
      } else {
        a.innerHTML = memberDashboardView() + accountSettingsCard();
      }
      initDraftRestoration();
    }

    /* -------------------------------------------------------------
       AUTHENTICATION VIEWS (Login / Signup / Forgot Password)
       ------------------------------------------------------------- */
    function authView() {
      if (mode === "forgot") return forgotView();
      const s = mode === "signup";
      return `
        <div class="max-w-md mx-auto w-full bg-white dark:bg-slate-800 p-8 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-xl shadow-slate-200/50 dark:shadow-none">
          <div class="text-center mb-6">
            <div class="inline-flex w-12 h-12 rounded-2xl bg-brand-600 items-center justify-center text-white font-bold text-2xl shadow-lg shadow-brand-500/30 mb-3">
              TN
            </div>
            <h2 class="text-2xl font-bold text-slate-900 dark:text-white">${s ? "Create your account" : "Welcome back"}</h2>
            <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">${s ? "Join your outreach team on TEENETWORK" : "Log in to record and view session reports"}</p>
          </div>

          <form onsubmit="event.preventDefault(); ${s ? 'signUp()' : 'logIn()'}" class="space-y-4">
            ${s ? `
              <div>
                <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 uppercase tracking-wider mb-1" for="nm">Full Name</label>
                <input id="nm" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 text-slate-900 dark:text-white focus:ring-2 focus:ring-brand-500 outline-none text-sm" placeholder="e.g. Ada Lovelace">
              </div>` : ''}

            <div>
              <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 uppercase tracking-wider mb-1" for="em">Email Address</label>
              <input id="em" type="email" required autocomplete="email" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 text-slate-900 dark:text-white focus:ring-2 focus:ring-brand-500 outline-none text-sm" placeholder="you@example.com">
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 uppercase tracking-wider mb-1" for="pw">Password</label>
              <input id="pw" type="password" required autocomplete="${s ? 'new-password' : 'current-password'}" minlength="6" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 text-slate-900 dark:text-white focus:ring-2 focus:ring-brand-500 outline-none text-sm" placeholder="At least 6 characters">
            </div>

            <button type="submit" id="authBtn" class="w-full py-3 px-4 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-semibold text-sm shadow-md shadow-brand-600/30 transition duration-150 mt-2">
              ${s ? "Create Account" : "Log In"}
            </button>
          </form>

          <div class="mt-6 pt-5 border-t border-slate-100 dark:border-slate-700/80 flex flex-col space-y-2 text-center text-sm">
            <button onclick="mode='${s ? 'login' : 'signup'}'; render();" class="text-brand-600 dark:text-brand-400 hover:underline font-medium">
              ${s ? "Already have an account? Log in" : "Need an account? Sign up here"}
            </button>
            ${!s ? `<button onclick="mode='forgot'; render();" class="text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200 text-xs">Forgot password?</button>` : ''}
          </div>
        </div>`;
    }

    async function signUp() {
      const btn = $("authBtn"); btn.disabled = true; btn.textContent = "Creating account...";
      try {
        await api("POST", "/api/signup", { name: $("nm").value, email: $("em").value, password: $("pw").value });
        await boot();
        flash("Account created successfully!");
      } catch (e) {
        flash("", e.message);
        btn.disabled = false; btn.textContent = "Create Account";
      }
    }

    async function logIn() {
      const btn = $("authBtn"); btn.disabled = true; btn.textContent = "Logging in...";
      try {
        await api("POST", "/api/login", { email: $("em").value, password: $("pw").value });
        await boot();
        flash("Welcome back!");
      } catch (e) {
        flash("", e.message);
        btn.disabled = false; btn.textContent = "Log In";
      }
    }

    function forgotView() {
      return `
        <div class="max-w-md mx-auto w-full bg-white dark:bg-slate-800 p-8 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-xl">
          <h2 class="text-2xl font-bold text-slate-900 dark:text-white">Forgot password</h2>
          <p class="text-sm text-slate-500 dark:text-slate-400 mt-1 mb-6">Enter your registered email and we'll send you a password reset link.</p>
          <div class="space-y-4">
            <div>
              <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 uppercase tracking-wider mb-1" for="fem">Email</label>
              <input id="fem" type="email" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 text-slate-900 dark:text-white text-sm" placeholder="you@example.com">
            </div>
            <button onclick="sendResetLink()" id="forgotBtn" class="w-full py-3 px-4 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-semibold text-sm transition">
              Send Reset Link
            </button>
            <button onclick="mode='login'; render();" class="w-full py-2.5 px-4 text-slate-600 dark:text-slate-400 hover:text-slate-900 text-sm">
              Back to log in
            </button>
          </div>
        </div>`;
    }

    async function sendResetLink() {
      const em = $("fem").value.trim();
      if (!em) return flash("", "Please enter your email");
      const btn = $("forgotBtn"); btn.disabled = true; btn.textContent = "Sending...";
      try {
        await api("POST", "/api/forgot", { email: em });
        flash("If that email is registered, a reset link has been dispatched.");
        mode = "login"; render();
      } catch (e) {
        flash("", e.message);
        btn.disabled = false; btn.textContent = "Send Reset Link";
      }
    }

    function resetView() {
      return `
        <div class="max-w-md mx-auto w-full bg-white dark:bg-slate-800 p-8 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-xl">
          <h2 class="text-2xl font-bold text-slate-900 dark:text-white">Choose a new password</h2>
          <p class="text-sm text-slate-500 dark:text-slate-400 mt-1 mb-6">Enter a new secure password of at least 6 characters.</p>
          <div class="space-y-4">
            <div>
              <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 uppercase mb-1" for="nrp">New Password</label>
              <input id="nrp" type="password" minlength="6" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 text-slate-900 dark:text-white text-sm">
            </div>
            <button onclick="saveNewPassword()" class="w-full py-3 px-4 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-semibold text-sm">
              Save New Password
            </button>
          </div>
        </div>`;
    }

    async function saveNewPassword() {
      const pw = $("nrp").value;
      if (pw.length < 6) return flash("", "Password must be at least 6 characters.");
      try {
        await api("POST", "/api/reset", { token: resetToken, password: pw });
        resetToken = null;
        history.replaceState(null, "", "/");
        mode = "login";
        flash("Password reset successfully! Please log in with your new credentials.");
        render();
      } catch (e) {
        flash("", e.message);
      }
    }

    /* -------------------------------------------------------------
       ADMIN DASHBOARD VIEW (KPIs, Reports Explorer, Member Activity)
       ------------------------------------------------------------- */
    function adminDashboardView() {
      const totalStudents = stats.totalStudents || reports.reduce((acc, r) => acc + (Number(r.students) || 0), 0);
      const totalReports = reports.length;
      const uniqueSchools = stats.uniqueSchools || [...new Set(reports.map(r => (r.school || "").trim().toLowerCase()).filter(Boolean))].length;
      const totalMembers = profiles.length;

      return `
        <div class="space-y-6">
          <!-- Executive Metrics KPI Banner -->
          <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm flex items-center space-x-3.5">
              <div class="w-12 h-12 rounded-xl bg-emerald-100 dark:bg-emerald-950 text-emerald-600 dark:text-emerald-400 flex items-center justify-center shrink-0 text-xl font-bold">
                🎓
              </div>
              <div>
                <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Students Reached</p>
                <h3 class="text-2xl font-extrabold text-slate-900 dark:text-white">${totalStudents.toLocaleString()}</h3>
              </div>
            </div>

            <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm flex items-center space-x-3.5">
              <div class="w-12 h-12 rounded-xl bg-blue-100 dark:bg-blue-950 text-blue-600 dark:text-blue-400 flex items-center justify-center shrink-0 text-xl font-bold">
                📑
              </div>
              <div>
                <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Sessions Held</p>
                <h3 class="text-2xl font-extrabold text-slate-900 dark:text-white">${totalReports}</h3>
              </div>
            </div>

            <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm flex items-center space-x-3.5">
              <div class="w-12 h-12 rounded-xl bg-purple-100 dark:bg-purple-950 text-purple-600 dark:text-purple-400 flex items-center justify-center shrink-0 text-xl font-bold">
                🏫
              </div>
              <div>
                <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Schools Visited</p>
                <h3 class="text-2xl font-extrabold text-slate-900 dark:text-white">${uniqueSchools}</h3>
              </div>
            </div>

            <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm flex items-center space-x-3.5">
              <div class="w-12 h-12 rounded-xl bg-amber-100 dark:bg-amber-950 text-amber-600 dark:text-amber-400 flex items-center justify-center shrink-0 text-xl font-bold">
                👥
              </div>
              <div>
                <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Active Members</p>
                <h3 class="text-2xl font-extrabold text-slate-900 dark:text-white">${totalMembers}</h3>
              </div>
            </div>
          </div>

          <!-- Navigation Tabs -->
          <div class="border-b border-slate-200 dark:border-slate-700 flex space-x-2 tabs-container">
            <button onclick="activeTab='reports'; render();" class="px-4 py-2.5 font-semibold text-sm border-b-2 transition ${activeTab === 'reports' ? 'border-brand-600 text-brand-600 dark:text-brand-400' : 'border-transparent text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white'}">
              📊 Activity & Reports Feed (${reports.length})
            </button>
            <button onclick="activeTab='members'; render();" class="px-4 py-2.5 font-semibold text-sm border-b-2 transition ${activeTab === 'members' ? 'border-brand-600 text-brand-600 dark:text-brand-400' : 'border-transparent text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white'}">
              👥 Member Activity Roster (${profiles.length})
            </button>
            <button onclick="activeTab='centers'; render();" class="px-4 py-2.5 font-semibold text-sm border-b-2 transition ${activeTab === 'centers' ? 'border-brand-600 text-brand-600 dark:text-brand-400' : 'border-transparent text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white'}">
              🏛️ Centres Management (${centers.length})
            </button>
          </div>

          <!-- Tab Content Panels -->
          ${activeTab === 'reports' ? adminReportsHub() : activeTab === 'members' ? adminMembersHub() : adminCentersHub()}
        </div>`;
    }

    /* Admin Reports & Activity Feed */
    function adminReportsHub() {
      let filtered = [...reports];

      if (filterCenter) filtered = filtered.filter(r => String(r.center_id) === String(filterCenter));

      if (filterMember) filtered = filtered.filter(r => String(r.member_id) === String(filterMember));
      if (filterQuery) {
        const q = filterQuery.toLowerCase();
        filtered = filtered.filter(r =>
          (r.school || "").toLowerCase().includes(q) ||
          (r.member_name || "").toLowerCase().includes(q) ||
          (r.details || "").toLowerCase().includes(q) ||
          (r.remarks || "").toLowerCase().includes(q) ||
          (r.challenges || "").toLowerCase().includes(q)
        );
      }
      if (filterDate === 'week') {
        const d = new Date(); d.setDate(d.getDate() - 7);

    async function assignMemberCenter(userId, centerId) {
      try {
        await api("PUT", `/api/users/${userId}/center`, { center_id: centerId || null });
        flash("Member centre assignment updated!");
        await boot();
      } catch (e) {
        flash("", e.message);
      }
    }

    async function promptResetPassword(userId, name) {
      const pw = prompt(`Enter a new temporary password for ${name} (minimum 6 characters):`);
      if (!pw) return;
      if (pw.length < 6) return alert("Password must be at least 6 characters.");
      try {
        await api("PUT", `/api/users/${userId}/password`, { password: pw });
        flash(`Password updated for ${name}. Share this temporary password privately.`);
      } catch (e) {
        flash("", e.message);
      }
    }

    async function createNewCenter() {
      const name = $("newCenterName").value.trim();
      if (!name) return flash("", "Please enter a centre name");
      try {
        await api("POST", "/api/centers", { name });
        flash("Centre created successfully!");
        await boot();
      } catch (e) {
        flash("", e.message);
      }
    }

    async function deleteCenterRow(id, name) {
      if (!confirm(`Are you sure you want to delete centre "${name}"? This will detach assigned members and reports.`)) return;
      try {
        await api("DELETE", `/api/centers/${id}`);
        flash("Centre deleted.");
        await boot();
      } catch (e) {
        flash("", e.message);
      }
    }

              <div class="border-2 border-dashed border-slate-300 dark:border-slate-600 rounded-2xl p-4 text-center hover:border-brand-500 transition cursor-pointer bg-slate-50/50 dark:bg-slate-900/40 relative">
                <input type="file" id="photoInput" multiple accept="image/*" onchange="handlePhotoUpload(event)" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full">
                <div class="flex flex-col items-center justify-center space-y-1">
                  <div class="w-10 h-10 rounded-full bg-brand-50 dark:bg-brand-950 text-brand-600 flex items-center justify-center text-xl">
                    📸
                  </div>
                  <p class="text-xs font-semibold text-slate-800 dark:text-slate-200">
                    Tap to take photos or upload from device
                  </p>
                  <p class="text-[11px] text-slate-400">
                    Images are automatically optimized and compressed for quick mobile upload.
                  </p>
                </div>
              </div>

              <!-- Photo Previews Grid -->
              <div id="photoPreviewGrid" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 gap-3 mt-3">
                ${renderPhotoPreviews()}
              </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <!-- Remarks -->
              <div>
                <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1" for="rf_remarks">
                  Remarks / Success Stories
                </label>
                <textarea id="rf_remarks" rows="2" oninput="saveDraft()" placeholder="Highlights, notable student breakthroughs, or teacher feedback..." class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 text-sm focus:ring-2 focus:ring-brand-500 outline-none"></textarea>
              </div>

              <!-- Challenges -->
              <div>
                <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1" for="rf_challenges">
                  Challenges Faced
                </label>
                <textarea id="rf_challenges" rows="2" oninput="saveDraft()" placeholder="Logistical issues, scheduling delays, classroom capacity..." class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 text-sm focus:ring-2 focus:ring-brand-500 outline-none"></textarea>
              </div>
            </div>

            <!-- Form Actions -->
            <div class="flex items-center justify-between pt-4 border-t border-slate-100 dark:border-slate-700">
              <button type="button" onclick="resetReportForm()" class="px-4 py-2.5 text-xs font-semibold text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white">
                ${currentEditId ? 'Cancel Edit' : 'Clear Form'}
              </button>

              <button type="submit" id="submitReportBtn" class="px-6 py-2.5 bg-brand-600 hover:bg-brand-700 text-white font-bold text-sm rounded-xl shadow-md shadow-brand-600/30 transition flex items-center gap-2">
                <span>${currentEditId ? 'Save Changes' : 'Submit Report'}</span>
              </button>
            </div>
          </form>
        </div>`;
    }

    function bumpStudents(amt) {
      const el = $("rf_students");
      el.value = (Number(el.value) || 0) + amt;
      saveDraft();
    }

    /* Client-side Image Compression & Photo Handling */
    async function compressImage(file, maxWidth = 1200, quality = 0.75) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = e => {
          const img = new Image();
          img.src = e.target.result;
          img.onload = () => {
            let width = img.width;
            let height = img.height;
            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }
            const canvas = document.createElement("canvas");
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL("image/jpeg", quality));
          };
          img.onerror = reject;
        };
        reader.onerror = reject;
      });
    }

    async function handlePhotoUpload(e) {
      const files = Array.from(e.target.files || []);
      if (!files.length) return;
      for (const file of files) {
        if (!file.type.startsWith("image/")) continue;
        try {
          const compressed = await compressImage(file);
          reportPhotos.push(compressed);
        } catch (err) {
          console.error("Compression error:", err);
        }
      }
      $("photoPreviewGrid").innerHTML = renderPhotoPreviews();
      saveDraft();
    }

    function removePhoto(idx) {
      reportPhotos.splice(idx, 1);
      $("photoPreviewGrid").innerHTML = renderPhotoPreviews();
      saveDraft();
    }

    function renderPhotoPreviews() {
      if (!reportPhotos.length) return '';
      return reportPhotos.map((dataUrl, idx) => `
        <div class="relative group rounded-xl overflow-hidden border border-slate-200 dark:border-slate-700 aspect-square bg-slate-100">
          <img src="${dataUrl}" class="w-full h-full object-cover">
          <button type="button" onclick="removePhoto(${idx})" class="absolute top-1 right-1 bg-black/70 hover:bg-rose-600 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs font-bold leading-none transition">
            &times;
          </button>
        </div>`).join('');
    }

    /* Autosave Draft to LocalStorage */
    function saveDraft() {
      if (currentEditId) return; // Don't overwrite draft while editing an existing report
      const draft = {
        school: $("rf_school") ? $("rf_school").value : "",
        date: $("rf_date") ? $("rf_date").value : "",
        students: $("rf_students") ? $("rf_students").value : "",
        attendance: $("rf_attendance") ? $("rf_attendance").value : "",
        details: $("rf_details") ? $("rf_details").value : "",
        remarks: $("rf_remarks") ? $("rf_remarks").value : "",
        challenges: $("rf_challenges") ? $("rf_challenges").value : "",
        photos: reportPhotos
      };
      localStorage.setItem("tn_draft", JSON.stringify(draft));
      const badge = $("draftBadge");
      if (badge && (draft.school || draft.details)) badge.classList.remove("hidden");
    }

    function initDraftRestoration() {
      if (currentEditId) return;
      const raw = localStorage.getItem("tn_draft");
      if (!raw) return;
      try {
        const draft = JSON.parse(raw);
        if ($("rf_school") && (draft.school || draft.details)) {
          $("rf_school").value = draft.school || "";
          if (draft.date) $("rf_date").value = draft.date;
          $("rf_students").value = draft.students || "";
          $("rf_attendance").value = draft.attendance || "";
          $("rf_details").value = draft.details || "";
          $("rf_remarks").value = draft.remarks || "";
          $("rf_challenges").value = draft.challenges || "";
          if (Array.isArray(draft.photos) && draft.photos.length) {
            reportPhotos = draft.photos;
            const grid = $("photoPreviewGrid");
            if (grid) grid.innerHTML = renderPhotoPreviews();
          }
          const badge = $("draftBadge");
          if (badge) badge.classList.remove("hidden");
        }
      } catch {}
    }

    function discardDraft() {
      localStorage.removeItem("tn_draft");
      resetReportForm();
      const badge = $("draftBadge");
      if (badge) badge.classList.add("hidden");
      flash("Draft discarded.");
    }

    function resetReportForm() {
      currentEditId = null;
      reportPhotos = [];
      localStorage.removeItem("tn_draft");
      if ($("rf_school")) $("rf_school").value = "";
      if ($("rf_date")) $("rf_date").value = new Date().toISOString().slice(0, 10);
      if ($("rf_students")) $("rf_students").value = "";
      if ($("rf_attendance")) $("rf_attendance").value = me ? me.name : "";
      if ($("rf_details")) $("rf_details").value = "";
      if ($("rf_remarks")) $("rf_remarks").value = "";
      if ($("rf_challenges")) $("rf_challenges").value = "";
      const grid = $("photoPreviewGrid");
      if (grid) grid.innerHTML = "";
      const badge = $("draftBadge");
      if (badge) badge.classList.add("hidden");
    }

    async function submitReport() {
      const btn = $("submitReportBtn");
      btn.disabled = true;
      btn.innerHTML = `<span>Saving...</span>`;

      const payload = {
        school: $("rf_school").value.trim(),
        date: $("rf_date").value,
        students: $("rf_students").value,
        attendance: $("rf_attendance").value.trim(),
        details: $("rf_details").value.trim(),
        remarks: $("rf_remarks").value.trim(),
        challenges: $("rf_challenges").value.trim(),
        photos: reportPhotos
      };

      try {
        if (currentEditId) {
          await api("PUT", `/api/reports/${currentEditId}`, payload);
          flash("Report updated successfully!");
        } else {
          await api("POST", "/api/reports", payload);
          flash("Report submitted! Thank you for your outreach activity.");
        }
        resetReportForm();
        await boot();
        activeTab = me.is_admin ? "reports" : "history";
        render();
      } catch (e) {
        flash("", e.message);
        btn.disabled = false;
        btn.innerHTML = `<span>${currentEditId ? 'Save Changes' : 'Submit Report'}</span>`;
      }
    }

    function startEditReport(repId) {
      const rep = reports.find(r => r.id === repId);
      if (!rep) return;
      currentEditId = repId;
      activeTab = "new";
      render();

      setTimeout(() => {
        if ($("rf_school")) $("rf_school").value = rep.school || "";
        if ($("rf_date")) $("rf_date").value = rep.date ? rep.date.slice(0, 10) : "";
        if ($("rf_students")) $("rf_students").value = rep.students || "";
        if ($("rf_attendance")) $("rf_attendance").value = rep.attendance || "";
        if ($("rf_details")) $("rf_details").value = rep.details || "";
        if ($("rf_remarks")) $("rf_remarks").value = rep.remarks || "";
        if ($("rf_challenges")) $("rf_challenges").value = rep.challenges || "";
        try {
          reportPhotos = typeof rep.photos === 'string' ? JSON.parse(rep.photos || '[]') : (rep.photos || []);
        } catch { reportPhotos = []; }
        const grid = $("photoPreviewGrid");
        if (grid) grid.innerHTML = renderPhotoPreviews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }, 50);
    }

    /* Member History View */
    function memberHistoryView() {
      return `
        <div class="space-y-4">
          <div class="flex items-center justify-between pb-2">
            <div>
              <h3 class="font-bold text-lg text-slate-900 dark:text-white">Reports from ${esc(cName(me.center_id))}</h3>
              <p class="text-xs text-slate-500">View and manage previous session submissions.</p>
            </div>
            <button onclick="exportCsv()" class="px-3.5 py-2 text-xs font-semibold rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-200 transition">
              Download CSV
            </button>
          </div>
          <div class="space-y-4">
            ${renderReportCards(reports)}
          </div>
        </div>`;
    }

    /* Shared Report Cards Component (Used in Admin & Member views) */
    function renderReportCards(list) {
      if (!list.length) {
        return `
          <div class="bg-white dark:bg-slate-800 p-8 rounded-2xl border border-slate-200 dark:border-slate-700 text-center text-slate-400">
            <p class="text-sm">No session reports found matching your criteria.</p>
          </div>`;
      }

      return list.map(r => {
        let photos = [];
        try {
          photos = typeof r.photos === 'string' ? JSON.parse(r.photos || '[]') : (r.photos || []);
        } catch {}

        const canEdit = me.is_admin || r.member_id === me.id;
        const formattedDate = r.date ? new Date(r.date).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }) : "";

        return `
          <div class="rep-card bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 p-5 shadow-sm space-y-3.5">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b border-slate-100 dark:border-slate-700 pb-3">
              <div>
                <div class="flex items-center gap-2 flex-wrap">
                  <h4 class="font-bold text-base text-slate-900 dark:text-white">${esc(r.school)}</h4>
                  <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300">
                    ${formattedDate}
                  </span>
                  <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-brand-50 dark:bg-brand-950/80 text-brand-700 dark:text-brand-300">
                    ${esc(cName(r.center_id))}
                  </span>
                </div>
                <p class="text-xs text-slate-500 mt-1">Submitted by <span class="font-medium text-slate-700 dark:text-slate-300">${esc(r.member_name || "Unknown Member")}</span></p>
              </div>

              <div class="flex items-center space-x-2 shrink-0">
                <span class="inline-flex items-center gap-1 text-xs font-bold px-2.5 py-1 rounded-xl bg-brand-500 text-white shadow-sm">
                  🎓 ${(Number(r.students) || 0).toLocaleString()} students
                </span>
                ${canEdit ? `
                  <button onclick="startEditReport(${r.id})" class="p-1.5 text-slate-500 hover:text-brand-600 dark:hover:text-brand-400 rounded-lg transition" title="Edit report">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                  </button>
                  <button onclick="deleteReportRow(${r.id})" class="p-1.5 text-slate-500 hover:text-rose-600 rounded-lg transition" title="Delete report">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                  </button>` : ''}
              </div>
            </div>

            <!-- Attendance -->
            ${r.attendance ? `
              <div class="text-xs text-slate-600 dark:text-slate-300">
                <span class="font-semibold text-slate-700 dark:text-slate-200">👥 Members Present:</span> ${esc(r.attendance)}
              </div>` : ''}

            <!-- Details -->
            <div class="text-sm text-slate-800 dark:text-slate-200 leading-relaxed whitespace-pre-line bg-slate-50/50 dark:bg-slate-900/40 p-3 rounded-xl border border-slate-100 dark:border-slate-800">
              ${esc(r.details)}
            </div>

            <!-- Attached Photos Gallery -->
            ${photos.length ? `
              <div>
                <p class="text-xs font-semibold text-slate-500 mb-1.5">Session Photos (${photos.length})</p>
                <div class="flex gap-2 flex-wrap">
                  ${photos.map((src, pidx) => `
                    <div onclick="openLightbox('${src}', '${esc(r.school)} - ${formattedDate}')" class="w-16 h-16 rounded-xl overflow-hidden border border-slate-200 dark:border-slate-700 cursor-pointer hover:opacity-90 hover:scale-105 transition transform shadow-sm">
                      <img src="${src}" class="w-full h-full object-cover" loading="lazy">
                    </div>`).join('')}
                </div>
              </div>` : ''}

            <!-- Remarks & Challenges Callouts -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs">
              ${r.remarks ? `
                <div class="p-2.5 rounded-xl bg-emerald-50/70 dark:bg-emerald-950/40 border border-emerald-100 dark:border-emerald-900 text-emerald-900 dark:text-emerald-200">
                  <span class="font-bold">✨ Remarks:</span> ${esc(r.remarks)}
                </div>` : ''}
              ${r.challenges ? `
                <div class="p-2.5 rounded-xl bg-amber-50/70 dark:bg-amber-950/40 border border-amber-100 dark:border-amber-900 text-amber-900 dark:text-amber-200">
                  <span class="font-bold">⚠️ Challenges:</span> ${esc(r.challenges)}
                </div>` : ''}
            </div>
          </div>`;
      }).join('');
    }

    async function deleteReportRow(id) {
      if (!confirm("Are you sure you want to delete this session report?")) return;
      try {
        await api("DELETE", `/api/reports/${id}`);
        flash("Report deleted.");
        await boot();
      } catch (e) {
        flash("", e.message);
      }
    }

    /* Lightbox modal for enlarged photos */
    function openLightbox(src, caption) {
      $("lightboxImg").src = src;
      $("lightboxCaption").textContent = caption || "";
      const lb = $("lightbox");
      lb.classList.remove("hidden");
      lb.classList.add("flex");
    }
    function closeLightbox(e) {
      if (e && e.target.id === "lightboxImg") return;
      const lb = $("lightbox");
      lb.classList.add("hidden");
      lb.classList.remove("flex");
    }
    document.addEventListener("keydown", e => { if (e.key === "Escape") closeLightbox(); });

    /* Export CSV */
    function exportCsv() {
      const q = v => '"' + String(v ?? "").replace(/"/g, '""') + '"';
      const rows = [["Report ID", "Centre", "Member", "School", "Date", "Students Present", "Members in Attendance", "Session Details", "Remarks", "Challenges", "Photos Count"]];
      reports.forEach(r => {
        let photoCount = 0;
        try {
          const arr = typeof r.photos === 'string' ? JSON.parse(r.photos || '[]') : (r.photos || []);
          photoCount = arr.length;
        } catch {}
        rows.push([
          r.id,
          cName(r.center_id),
          r.member_name,
          r.school,
          r.date,
          r.students,
          r.attendance,
          r.details,
          r.remarks,
          r.challenges,
          photoCount
        ]);
      });
      const blob = new Blob([rows.map(r => r.map(q).join(",")).join("\n")], { type: "text/csv;charset=utf-8;" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `teenetwork-reports-${new Date().toISOString().slice(0, 10)}.csv`;
      a.click();
    }

    /* Account Settings Card (Password Change) */
    function accountSettingsCard() {
      return `
        <div class="mt-8 bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 p-5 max-w-lg mx-auto no-print">
          <h3 class="font-bold text-sm text-slate-900 dark:text-white mb-1">Change Account Password</h3>
          <p class="text-xs text-slate-500 mb-3">Update your password to keep your account secure.</p>
          <div class="space-y-3">
            <div>
              <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 uppercase mb-1" for="currPw">Current Password</label>
              <input id="currPw" type="password" class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 text-sm">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 uppercase mb-1" for="chgPw">New Password (min 6 characters)</label>
              <input id="chgPw" type="password" minlength="6" class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 text-sm">
            </div>
            <button onclick="changePassword()" class="w-full py-2.5 px-4 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 font-semibold text-xs text-slate-800 dark:text-slate-200 transition">
              Update Password
            </button>
          </div>
        </div>`;
    }

    async function changePassword() {
      const cur = $("currPw").value;
      const nw = $("chgPw").value;
      if (!cur || !nw) return flash("", "Please fill in both current and new passwords.");
      if (nw.length < 6) return flash("", "New password must be at least 6 characters.");
      try {
        await api("PUT", "/api/password", { current_password: cur, new_password: nw });
        $("currPw").value = "";
        $("chgPw").value = "";
        flash("Password updated successfully!");
      } catch (e) {
        flash("", e.message);
      }
    }

    // Start App
    boot();
  </script>
</body>
</html>
